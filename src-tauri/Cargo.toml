[package]
name = "chronicle"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }
regex = "1" # build.rs reads the command list out of generate_handler![…] for the app ACL manifest

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "unstable"] } # unstable: child webviews for the Web pane
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
portable-pty = "0.9"
base64 = "0.22"
regex = "1"
sha2 = "0.10"
libc = "0.2" # SIGTERM for init_cancel (graceful stop before SIGKILL)
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
notify = "6"
# ACP types only (serde structs; the parent agent-client-protocol crate drags
# async/transport machinery we don't want — our loop is plain threads + channels)
agent-client-protocol-schema = { version = "1.4.0", features = ["unstable"] }
sysinfo = "0.39.6"
tauri-plugin-notification = "2.3.3"
core-foundation = "0.10"      # CFString → Rust string for the IOKit power-source type
core-foundation-sys = "0.8"   # CFRunLoop + CFRelease for the power-source notification
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSError", "NSObject"] }
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSButton", "NSControl", "NSView", "NSResponder"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKWebViewConfiguration", "WKUserContentController", "WKContentRuleList", "WKContentRuleListStore", "WKNavigation", "block2"] }
block2 = "0.6"
flate2 = "1" # the bundled block-list chunks ship gzipped
url = "2"
trash = "5.2.8" # Finder's Trash, restorable — the app never unlinks a user's file
percent-encoding = "2"

# muda is what tauri::menu parses accelerator strings with; it is not re-exported, so
# the test that pins every Go accelerator borrows the type directly. Version tracks
# the one tauri already resolves (Cargo.lock: muda 0.19.3).
[dev-dependencies]
muda = "0.19"

[profile.release]
strip = true
lto = true
